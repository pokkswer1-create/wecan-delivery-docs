<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>온라인 도장 · 위캔</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3848;
      --text: #eef3f8;
      --muted: #93a4b8;
      --accent: #1f8a70;
      --accent-2: #f0b429;
      --stamp: #e31c23;
      --radius: 14px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1000px 420px at 8% -8%, #3a1d1d 0%, transparent 55%),
        radial-gradient(800px 360px at 100% 0%, #1d3a33 0%, transparent 50%),
        var(--bg);
      padding: 20px 16px 48px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .app-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 16px;
      padding: 4px;
      background: #12181f;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .app-nav a {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      padding: 11px 8px;
      border-radius: 9px;
    }
    .app-nav a.active {
      background: color-mix(in srgb, var(--accent) 28%, #1a222c);
      color: var(--text);
    }
    header .brand {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }
    header p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .font-col {
      background: #fff;
      border: 2px solid #d8dde5;
      border-radius: 10px;
      padding: 8px 6px 10px;
      cursor: pointer;
      text-align: center;
    }
    .font-col.selected {
      border-color: var(--stamp);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--stamp) 35%, transparent);
    }
    .font-col .radio {
      width: 16px;
      height: 16px;
      border: 2px solid #9aa3b2;
      border-radius: 50%;
      margin: 0 auto 8px;
      position: relative;
    }
    .font-col.selected .radio {
      border-color: var(--stamp);
    }
    .font-col.selected .radio::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--stamp);
    }
    .font-col .grid4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 8px;
    }
    .font-col .grid4 button {
      width: 100%;
      aspect-ratio: 1;
      margin: 0;
      padding: 2px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .font-col .grid4 button.on {
      border-color: var(--stamp);
      background: #fff5f5;
    }
    .font-col .grid4 canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .font-col .fname {
      color: #222;
      font-size: 12px;
      font-weight: 700;
    }
    .preview-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      background: #fff;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
    }
    #preview {
      width: 200px;
      height: 200px;
      max-width: 100%;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.primary {
      background: linear-gradient(180deg, #2aa889, var(--accent));
      color: #fff;
    }
    button.ghost {
      background: #12181f;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.danger {
      background: color-mix(in srgb, #e35d6a 25%, #12181f);
      color: #ffc9cf;
      border: 1px solid color-mix(in srgb, #e35d6a 50%, var(--line));
    }
    .hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .status {
      min-height: 20px;
      font-size: 13px;
      margin-top: 4px;
    }
    .status.ok { color: #3ecf8e; }
    .status.err { color: #e35d6a; }
    .steps {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .sel-label {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: -4px 0 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="app-nav" aria-label="주요 메뉴">
      <a href="/">납품서류</a>
      <a class="active" href="/stamp.html" aria-current="page">온라인 도장</a>
    </nav>
    <header>
      <div class="brand">WECAN</div>
      <h1>온라인 도장</h1>
      <p>이름을 입력하고 아래 샘플 중 원하는 도장을 고르세요. (잡코리아 스타일)</p>
    </header>

    <div class="card">
      <h2>도장 만들기</h2>
      <label for="name">이름</label>
      <input id="name" type="text" maxlength="4" placeholder="예: 김강선 / 홍길동" value="김강선" />

      <label>도장 모양 선택</label>
      <p class="hint">서체마다 원형·사각 × 한글·한자 4가지가 있습니다. 원하는 칸을 누르세요.</p>
      <div class="picker" id="picker"></div>
      <div class="sel-label" id="selLabel"></div>

      <div class="preview-wrap">
        <canvas id="preview" width="512" height="512"></canvas>
      </div>

      <button class="primary" type="button" id="makeBtn">도장 만들기</button>
      <button class="ghost" type="button" id="downloadBtn">이미지로 저장하기</button>
    </div>

    <div class="card">
      <h2>납품서류에 적용</h2>
      <p class="hint">만든 도장을 견적서·납품서·거래명세서 서명란에 사용합니다. (접속 비밀번호 필요)</p>
      <label for="pin">접속 비밀번호</label>
      <input id="pin" type="password" autocomplete="current-password" />
      <button class="primary" type="button" id="applyBtn">서류 도장으로 적용</button>
      <button class="danger" type="button" id="resetBtn">기본 도장으로 되돌리기</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <h2>이용방법</h2>
      <ol class="steps">
        <li>이름을 입력합니다.</li>
        <li>굴림·궁서·바탕 중 원하는 도장 칸을 고릅니다.</li>
        <li>도장 만들기 / 저장 / 서류 적용을 합니다.</li>
      </ol>
    </div>
  </div>

  <script>
    const INK = "#e31c23";
    const FONTS = [
      {
        key: "gulim",
        label: "굴림체",
        family: 'Gulim, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
        weight: "700",
      },
      {
        key: "gungseo",
        label: "궁서체",
        family: 'Gungsuh, "Batang", "Apple Myungjo", serif',
        weight: "700",
      },
      {
        key: "batang",
        label: "바탕체",
        family: 'Batang, "Apple Myungjo", serif',
        weight: "700",
      },
    ];

    // 성씨 우선
    const SURNAME = {
      김: "金", 이: "李", 박: "朴", 최: "崔", 정: "鄭", 강: "姜", 조: "趙", 윤: "尹",
      장: "張", 임: "林", 한: "韓", 오: "吳", 서: "徐", 신: "申", 권: "權", 황: "黃",
      안: "安", 송: "宋", 전: "全", 홍: "洪", 유: "柳", 고: "高", 문: "文", 양: "梁",
      손: "孫", 배: "裵", 백: "白", 허: "許", 남: "南", 심: "沈", 노: "盧", 하: "河",
      곽: "郭", 성: "成", 차: "車", 주: "周", 우: "禹", 구: "具", 민: "閔", 류: "柳",
      진: "陳", 엄: "嚴", 원: "元", 채: "蔡", 천: "千", 방: "方", 공: "孔", 현: "玄",
      배: "裵", 변: "卞", 마: "馬", 석: "石", 선: "宣", 설: "薛", 염: "廉", 예: "芮",
    };

    // 이름 음절
    const GIVEN = {
      강: "康", 선: "善", 길: "吉", 동: "東", 영: "英", 수: "秀", 호: "浩", 준: "俊",
      현: "賢", 우: "祐", 재: "宰", 석: "錫", 훈: "勳", 태: "泰", 경: "京", 환: "煥",
      민: "敏", 지: "智", 혜: "慧", 은: "恩", 아: "雅", 연: "姸", 윤: "允", 나: "娜",
      미: "美", 정: "姃", 희: "喜", 숙: "淑", 순: "順", 철: "哲", 병: "炳", 광: "光",
      덕: "德", 용: "勇", 규: "圭", 찬: "燦", 혁: "赫", 승: "承", 빈: "彬", 웅: "雄",
      기: "基", 종: "鍾", 엽: "燁", 범: "範", 근: "根", 형: "炯", 욱: "旭", 일: "一",
      식: "植", 섭: "燮", 원: "源", 평: "平", 상: "相", 대: "大", 중: "中", 성: "成",
      진: "眞", 서: "瑞", 하: "夏", 림: "林", 라: "羅", 자: "子", 인: "印", 홍: "弘",
    };

    const VARIANTS = [
      { shape: "circle", script: "hangul", title: "원형 한글" },
      { shape: "square", script: "hangul", title: "사각 한글" },
      { shape: "circle", script: "hanja", title: "원형 한자" },
      { shape: "square", script: "hanja", title: "사각 한자" },
    ];

    const els = {
      name: document.getElementById("name"),
      picker: document.getElementById("picker"),
      preview: document.getElementById("preview"),
      selLabel: document.getElementById("selLabel"),
      makeBtn: document.getElementById("makeBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      applyBtn: document.getElementById("applyBtn"),
      resetBtn: document.getElementById("resetBtn"),
      pin: document.getElementById("pin"),
      status: document.getElementById("status"),
    };

    let selected = { font: "gulim", shape: "circle", script: "hangul" };
    let lastDataUrl = "";
    let lastText = "";

    function rawName() {
      return (els.name.value || "").trim().replace(/\s+/g, "").slice(0, 4);
    }

    function hangulStampText() {
      let n = rawName();
      if (!n) return "";
      if (!n.endsWith("인") && n.length < 4) n += "인";
      return n.slice(0, 4);
    }

    function toHanjaChar(ch, index) {
      if (ch === "인") return "印";
      if (index === 0 && SURNAME[ch]) return SURNAME[ch];
      if (GIVEN[ch]) return GIVEN[ch];
      if (SURNAME[ch]) return SURNAME[ch];
      return ch;
    }

    function hanjaStampText() {
      const h = hangulStampText();
      if (!h) return "";
      return [...h].map((ch, i) => toHanjaChar(ch, i)).join("");
    }

    function stampTextFor(script) {
      return script === "hanja" ? hanjaStampText() : hangulStampText();
    }

    function fontMeta(key) {
      return FONTS.find((f) => f.key === key) || FONTS[0];
    }

    function drawStamp(canvas, text, fontKey, shapeKind, size) {
      const ctx = canvas.getContext("2d");
      const s = size || canvas.width;
      canvas.width = s;
      canvas.height = s;
      ctx.clearRect(0, 0, s, s);

      const cx = s / 2;
      const cy = s / 2;
      const stroke = Math.max(2, s * 0.045);
      ctx.strokeStyle = INK;
      ctx.fillStyle = INK;
      ctx.lineWidth = stroke;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (shapeKind === "square") {
        const pad = s * 0.08;
        const w = s - pad * 2;
        const r = s * 0.08;
        roundRect(ctx, pad, pad, w, w, r);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.42, 0, Math.PI * 2);
        ctx.stroke();
      }

      const chars = [...text];
      if (!chars.length) return;

      const font = fontMeta(fontKey);
      // 잡코리아처럼 최대 4자를 2×2로 배치
      while (chars.length < 4) chars.push("");
      const show = chars.slice(0, 4);
      const fontSize = s * (fontKey === "gungseo" ? 0.26 : 0.28);
      ctx.font = `${font.weight} ${fontSize}px ${font.family}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const gap = s * 0.22;
      const positions = [
        [cx - gap / 2, cy - gap / 2],
        [cx + gap / 2, cy - gap / 2],
        [cx - gap / 2, cy + gap / 2],
        [cx + gap / 2, cy + gap / 2],
      ];
      show.forEach((ch, i) => {
        if (!ch) return;
        ctx.fillText(ch, positions[i][0], positions[i][1] + s * 0.01);
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function selectionTitle() {
      const f = fontMeta(selected.font).label;
      const v = VARIANTS.find(
        (x) => x.shape === selected.shape && x.script === selected.script
      );
      return `${f} · ${v ? v.title : ""}`.trim();
    }

    function renderPicker() {
      const sampleHangul = hangulStampText() || "홍길동인";
      const sampleHanja = hanjaStampText() || "洪吉東印";
      els.picker.innerHTML = "";

      FONTS.forEach((font) => {
        const col = document.createElement("div");
        col.className = "font-col" + (selected.font === font.key ? " selected" : "");
        col.innerHTML = `<div class="radio"></div><div class="grid4"></div><div class="fname">${font.label}</div>`;
        const grid = col.querySelector(".grid4");

        VARIANTS.forEach((v) => {
          const btn = document.createElement("button");
          btn.type = "button";
          const on =
            selected.font === font.key &&
            selected.shape === v.shape &&
            selected.script === v.script;
          if (on) btn.classList.add("on");
          const c = document.createElement("canvas");
          c.width = 128;
          c.height = 128;
          const text = v.script === "hanja" ? sampleHanja : sampleHangul;
          drawStamp(c, text, font.key, v.shape, 128);
          btn.appendChild(c);
          btn.title = `${font.label} ${v.title}`;
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            selected = { font: font.key, shape: v.shape, script: v.script };
            renderPicker();
            make(false);
          });
          grid.appendChild(btn);
        });

        col.addEventListener("click", () => {
          selected.font = font.key;
          renderPicker();
          make(false);
        });
        els.picker.appendChild(col);
      });
    }

    function make(announce) {
      const text = stampTextFor(selected.script);
      if (!text) {
        setStatus("err", "이름을 입력하세요.");
        return false;
      }
      drawStamp(els.preview, text, selected.font, selected.shape, 512);
      lastDataUrl = els.preview.toDataURL("image/png");
      lastText = text;
      els.selLabel.textContent = selectionTitle() + ` · ${text}`;
      if (announce !== false) setStatus("", "");
      return true;
    }

    function setStatus(kind, msg) {
      els.status.className = "status" + (kind ? " " + kind : "");
      els.status.textContent = msg || "";
    }

    function refreshAll() {
      renderPicker();
      make(false);
    }

    els.makeBtn.addEventListener("click", () => {
      if (make(true)) setStatus("ok", "도장이 완성되었습니다.");
    });
    els.name.addEventListener("input", refreshAll);
    els.name.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        els.makeBtn.click();
      }
    });

    els.downloadBtn.addEventListener("click", () => {
      if (!make(false)) return;
      const a = document.createElement("a");
      a.href = lastDataUrl;
      a.download = `도장_${lastText || "stamp"}.png`;
      a.click();
    });

    els.applyBtn.addEventListener("click", async () => {
      if (!make(false)) return;
      if (!els.pin.value) {
        setStatus("err", "접속 비밀번호를 입력하세요.");
        return;
      }
      try {
        const res = await fetch("/api/seal", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: els.pin.value, image: lastDataUrl }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "적용 실패");
        setStatus("ok", "서류 도장에 적용했습니다.");
      } catch (err) {
        setStatus("err", err.message);
      }
    });

    els.resetBtn.addEventListener("click", async () => {
      if (!els.pin.value) {
        setStatus("err", "접속 비밀번호를 입력하세요.");
        return;
      }
      try {
        const res = await fetch("/api/seal", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: els.pin.value }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "복원 실패");
        setStatus("ok", "기본 도장으로 되돌렸습니다.");
      } catch (err) {
        setStatus("err", err.message);
      }
    });

    refreshAll();
  </script>
</body>
</html>
