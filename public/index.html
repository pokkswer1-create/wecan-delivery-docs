<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>위캔 납품서류</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3848;
      --text: #eef3f8;
      --muted: #93a4b8;
      --accent: #1f8a70;
      --accent-2: #f0b429;
      --danger: #e35d6a;
      --ok: #3ecf8e;
      --radius: 14px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #1d3a33 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #2a2416 0%, transparent 50%),
        var(--bg);
      padding: 20px 16px 40px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    header { margin-bottom: 18px; }
    header .brand {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="number"],
    input[type="password"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    textarea { min-height: 64px; resize: vertical; }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .presets button {
      width: auto;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #12181f;
    }
    .item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .item .top strong { font-size: 13px; }
    .item .del {
      width: auto;
      padding: 6px 10px;
      background: transparent;
      border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent);
      color: #ffb4bc;
      border-radius: 8px;
      font-size: 12px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 8px;
    }
    .sumline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0f161d;
      border: 1px solid var(--line);
      margin-bottom: 8px;
      font-size: 14px;
    }
    .sumline strong { color: var(--accent-2); font-size: 16px; }
    .checks label.inline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      margin: 0 0 10px;
    }
    .checks input { width: 18px; height: 18px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: linear-gradient(180deg, #2aa883, var(--accent));
      color: #fff;
    }
    button.primary:disabled { opacity: 0.55; cursor: wait; }
    button.ghost {
      margin-top: 8px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .status.show { display: block; }
    .status.ok {
      background: color-mix(in srgb, var(--ok) 18%, #12181f);
      border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent);
      color: #d8ffe9;
    }
    .status.err {
      background: color-mix(in srgb, var(--danger) 18%, #12181f);
      border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
      color: #ffd6db;
    }
    .status a { color: var(--accent-2); }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: -4px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">WECAN</div>
      <h1>납품서류 만들기</h1>
      <p>품명을 직접 쓰거나, 아래 버튼으로 기본 품목을 불러온 뒤 수정하세요.</p>
    </header>

    <form id="form">
      <div class="card">
        <h2>접속</h2>
        <label for="pin">비밀번호</label>
        <input id="pin" type="password" autocomplete="current-password" required />
      </div>

      <div class="card">
        <h2>문서 제목</h2>
        <input id="docTitle" type="text" placeholder="예: 지주대 임대 / 심판대 납품" value="납품" />
        <label for="note">참고사항(선택)</label>
        <textarea id="note" placeholder="비우면 자동 생성"></textarea>
      </div>

      <div class="card">
        <h2>품목</h2>
        <p class="hint">기본 품목 불러오기 (추가됨 · 수정 가능)</p>
        <div class="presets" id="presets"></div>
        <div id="items"></div>
        <button class="ghost" type="button" id="addItem">+ 품목 추가</button>
        <div class="sumline" style="margin-top:12px">
          <span>합계 (부가세포함)</span>
          <strong id="sumText">0원</strong>
        </div>
      </div>

      <div class="card">
        <h2>수신 / 일자</h2>
        <label for="client">수신처</label>
        <input id="client" type="text" />
        <label for="date">작성일자</label>
        <input id="date" type="date" />
        <p class="hint">오늘 날짜로 자동 입력됩니다. 필요하면 수정하세요.</p>
      </div>

      <div class="card">
        <h2>이메일</h2>
        <div class="checks">
          <label class="inline"><input id="sendEmail" type="checkbox" checked /> PDF를 이메일로 보내기</label>
        </div>
        <label for="emailTo">받는 사람</label>
        <input id="emailTo" type="email" placeholder="example@email.com" />
        <label for="emailCc">참조(선택)</label>
        <input id="emailCc" type="email" placeholder="cc@email.com" />
        <label for="subject">제목(선택)</label>
        <input id="subject" type="text" placeholder="비우면 자동 생성" />
        <p class="hint" id="emailHint"></p>
      </div>

      <button class="primary" id="submitBtn" type="submit">PDF 만들고 보내기</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const els = {
      presets: document.getElementById("presets"),
      items: document.getElementById("items"),
      addItem: document.getElementById("addItem"),
      docTitle: document.getElementById("docTitle"),
      note: document.getElementById("note"),
      sumText: document.getElementById("sumText"),
      client: document.getElementById("client"),
      date: document.getElementById("date"),
      pin: document.getElementById("pin"),
      sendEmail: document.getElementById("sendEmail"),
      emailTo: document.getElementById("emailTo"),
      emailCc: document.getElementById("emailCc"),
      subject: document.getElementById("subject"),
      emailHint: document.getElementById("emailHint"),
      form: document.getElementById("form"),
      submitBtn: document.getElementById("submitBtn"),
      status: document.getElementById("status"),
    };

    let meta = null;
    let rows = [];
    let photoPackageIds = [];

    function todayLocal() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function money(n) {
      return Math.round(Number(n) || 0).toLocaleString("ko-KR");
    }

    function blankRow() {
      return { name: "", spec: "", unit: "식", qty: 1, unitPriceIncl: 0 };
    }

    function calcSum() {
      const sum = rows.reduce((s, r) => s + Number(r.qty || 0) * Number(r.unitPriceIncl || 0), 0);
      els.sumText.textContent = money(sum) + "원";
      return sum;
    }

    function readDomIntoRows() {
      const cards = [...els.items.querySelectorAll(".item")];
      rows = cards.map((card) => ({
        name: card.querySelector(".f-name").value.trim(),
        spec: card.querySelector(".f-spec").value.trim(),
        unit: card.querySelector(".f-unit").value.trim() || "식",
        qty: Number(card.querySelector(".f-qty").value || 0),
        unitPriceIncl: Number(card.querySelector(".f-price").value || 0),
      }));
      calcSum();
    }

    function renderRows() {
      els.items.innerHTML = rows
        .map(
          (r, i) => `<div class="item" data-i="${i}">
            <div class="top">
              <strong>품목 ${i + 1}</strong>
              <button type="button" class="del" data-del="${i}">삭제</button>
            </div>
            <label>품명</label>
            <input class="f-name" type="text" value="${escapeAttr(r.name)}" placeholder="예: 배구 심판대" />
            <label>규격/설명</label>
            <input class="f-spec" type="text" value="${escapeAttr(r.spec)}" placeholder="예: 이동식 / 7일" />
            <div class="row3">
              <div>
                <label>단위</label>
                <input class="f-unit" type="text" value="${escapeAttr(r.unit || "식")}" />
              </div>
              <div>
                <label>수량</label>
                <input class="f-qty" type="number" step="1" min="0" value="${r.qty}" />
              </div>
              <div>
                <label>단가(부가세포함)</label>
                <input class="f-price" type="number" step="1000" min="0" value="${r.unitPriceIncl}" />
              </div>
            </div>
          </div>`
        )
        .join("");

      els.items.querySelectorAll("input").forEach((el) => {
        el.addEventListener("input", () => {
          readDomIntoRows();
        });
      });
      els.items.querySelectorAll("[data-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          readDomIntoRows();
          rows.splice(Number(btn.dataset.del), 1);
          if (!rows.length) rows = [blankRow()];
          renderRows();
        });
      });
      calcSum();
    }

    function escapeAttr(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }

    function loadPreset(pkg, replace) {
      readDomIntoRows();
      const mapped = (pkg.items || []).map((it) => ({
        name: it.name,
        spec: it.spec || "",
        unit: it.unit || "식",
        qty: it.qty || 1,
        unitPriceIncl: it.unitPriceIncl || 0,
      }));
      rows = replace ? mapped : [...rows.filter((r) => r.name || r.unitPriceIncl), ...mapped];
      if (!rows.length) rows = [blankRow()];
      if (!photoPackageIds.includes(pkg.id)) photoPackageIds.push(pkg.id);
      if (!els.docTitle.value || els.docTitle.value === "납품") {
        els.docTitle.value = pkg.title;
      } else if (!els.docTitle.value.includes(pkg.title)) {
        els.docTitle.value = els.docTitle.value + " / " + pkg.title;
      }
      renderRows();
    }

    function syncEmailRequired() {
      els.emailTo.required = els.sendEmail.checked;
      els.submitBtn.textContent = els.sendEmail.checked
        ? "PDF 만들고 보내기"
        : "PDF만 만들기";
    }

    function showStatus(type, html) {
      els.status.className = "status show " + type;
      els.status.innerHTML = html;
    }

    async function loadMeta() {
      const res = await fetch("/api/meta");
      meta = await res.json();
      els.client.value = meta.clientDefault || "";
      els.client.placeholder = "수신처 입력";
      els.date.value = todayLocal();
      els.emailHint.textContent = meta.emailConfigured
        ? `발송 가능 (${meta.emailProvider || "설정됨"})`
        : "이메일 미설정 · 지메일 앱 비밀번호 또는 Resend/Brevo API 키 필요";

      els.presets.innerHTML = meta.packages
        .map(
          (p) =>
            `<button type="button" data-preset="${p.id}">${p.title}</button>`
        )
        .join("");
      els.presets.querySelectorAll("[data-preset]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const pkg = meta.packages.find((p) => p.id === btn.dataset.preset);
          loadPreset(pkg, false);
        });
      });

      rows = [blankRow()];
      renderRows();
      syncEmailRequired();
    }

    els.addItem.addEventListener("click", () => {
      readDomIntoRows();
      rows.push(blankRow());
      renderRows();
    });
    els.sendEmail.addEventListener("change", syncEmailRequired);

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      readDomIntoRows();
      const customItems = rows.filter((r) => r.name);
      if (!customItems.length) {
        showStatus("err", "품명을 1개 이상 입력하세요.");
        return;
      }

      const payload = {
        pin: els.pin.value,
        title: els.docTitle.value.trim() || "납품",
        note: els.note.value.trim(),
        customItems,
        photoPackageIds,
        client: els.client.value.trim(),
        date: els.date.value || todayLocal(),
        emailTo: els.emailTo.value.trim(),
        emailCc: els.emailCc.value.trim(),
        subject: els.subject.value.trim(),
        sendEmail: els.sendEmail.checked,
      };

      els.submitBtn.disabled = true;
      showStatus("ok", "생성 중… 잠시만 기다려 주세요.");

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "실패");
        showStatus(
          data.emailError ? "err" : "ok",
          [
            `완료: ${data.fileName}`,
            `합계: ${money(data.totalSum)}원`,
            data.emailed
              ? "이메일 발송 완료"
              : data.emailError || "이메일 미발송 (다운로드만)",
            `<a href="${data.downloadUrl}" download>PDF 다운로드</a>`,
          ].join("\n")
        );
      } catch (err) {
        showStatus("err", err.message || String(err));
      } finally {
        els.submitBtn.disabled = false;
      }
    });

    loadMeta().catch((err) => showStatus("err", err.message));
  </script>
</body>
</html>
