<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>위캔 납품서류</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3848;
      --text: #eef3f8;
      --muted: #93a4b8;
      --accent: #1f8a70;
      --accent-2: #f0b429;
      --danger: #e35d6a;
      --ok: #3ecf8e;
      --radius: 14px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #1d3a33 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #2a2416 0%, transparent 50%),
        var(--bg);
      padding: 20px 16px 40px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    header { margin-bottom: 18px; }
    header .brand {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="number"],
    input[type="password"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    textarea { min-height: 64px; resize: vertical; }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .presets button {
      width: auto;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .item, .cat-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #12181f;
    }
    .item .top, .cat-item .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .item .top strong, .cat-item .top strong { font-size: 13px; }
    .del, .mini {
      width: auto;
      padding: 6px 10px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 8px;
      font-size: 12px;
    }
    .del {
      border-color: color-mix(in srgb, var(--danger) 50%, transparent);
      color: #ffb4bc;
    }
    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 8px;
    }
    .sumline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0f161d;
      border: 1px solid var(--line);
      margin-bottom: 8px;
      font-size: 14px;
    }
    .sumline strong { color: var(--accent-2); font-size: 16px; }
    .checks label.inline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      margin: 0 0 10px;
    }
    .checks input { width: 18px; height: 18px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: linear-gradient(180deg, #2aa883, var(--accent));
      color: #fff;
    }
    button.primary:disabled { opacity: 0.55; cursor: wait; }
    button.ghost {
      margin-top: 8px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-row button { margin-top: 0; }
    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .status.show { display: block; }
    .status.ok {
      background: color-mix(in srgb, var(--ok) 18%, #12181f);
      border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent);
      color: #d8ffe9;
    }
    .status.err {
      background: color-mix(in srgb, var(--danger) 18%, #12181f);
      border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
      color: #ffd6db;
    }
    .status a { color: var(--accent-2); }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: -4px;
      margin-bottom: 10px;
    }
    .hidden { display: none !important; }
    .price-tag {
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">WECAN</div>
      <h1>납품서류 만들기</h1>
      <p>기본 품목을 등록·수정·삭제하고, 불러와 서류를 만드세요. · <a href="/stamp.html" style="color:var(--accent-2);font-weight:600;text-decoration:none">온라인 도장</a></p>
    </header>

    <form id="form">
      <div class="card">
        <h2>접속</h2>
        <label for="pin">비밀번호</label>
        <input id="pin" type="password" autocomplete="current-password" required />
      </div>

      <div class="card">
        <h2>문서 제목</h2>
        <input id="docTitle" type="text" placeholder="예: 지주대 임대 / 심판대 납품" value="납품" />
        <label for="note">참고사항(선택)</label>
        <textarea id="note" placeholder="비우면 자동 생성"></textarea>
      </div>

      <div class="card">
        <h2>품목 네비게이션</h2>
        <p class="hint">아래 버튼 = 메뉴입니다. 등록/수정/삭제로 이 버튼들을 직접 관리하세요.</p>
        <div class="presets" id="presets"></div>
        <p class="hint">버튼을 누르면 이번 서류에 품목이 추가됩니다.</p>
        <button class="ghost" type="button" id="toggleManage">메뉴 편집 닫기</button>
        <div id="manageBox" style="margin-top:12px">
          <p class="hint">여기 목록이 곧 위 버튼 메뉴입니다. 금액도 여기서 정한 뒤 저장하세요.</p>
          <div id="catalog"></div>
          <div class="btn-row">
            <button class="ghost" type="button" id="addCatalog">+ 메뉴 등록</button>
            <button class="primary" type="button" id="saveCatalog">메뉴 저장</button>
          </div>
          <div class="status" id="catalogStatus"></div>
        </div>
      </div>

      <div class="card">
        <h2>이번 서류 품목</h2>
        <div id="items"></div>
        <button class="ghost" type="button" id="addItem">+ 품목 추가</button>
        <div class="sumline" style="margin-top:12px">
          <span>합계 (부가세포함)</span>
          <strong id="sumText">0원</strong>
        </div>
      </div>

      <div class="card">
        <h2>수신 / 일자</h2>
        <label for="client">수신처</label>
        <input id="client" type="text" placeholder="수신처 입력" />
        <label for="date">작성일자</label>
        <input id="date" type="date" />
        <p class="hint">오늘 날짜로 자동 입력됩니다. 필요하면 수정하세요.</p>
      </div>

      <div class="card">
        <h2>이메일</h2>
        <div class="checks">
          <label class="inline"><input id="sendEmail" type="checkbox" checked /> PDF를 이메일로 보내기</label>
        </div>
        <label for="emailTo">받는 사람</label>
        <input id="emailTo" type="email" placeholder="example@email.com" />
        <label for="emailCc">참조(선택)</label>
        <input id="emailCc" type="email" placeholder="cc@email.com" />
        <label for="subject">제목(선택)</label>
        <input id="subject" type="text" placeholder="비우면 자동 생성" />
        <p class="hint" id="emailHint"></p>
      </div>

      <button class="primary" id="submitBtn" type="submit">PDF 만들고 보내기</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "wecan_presets_v1";
    const els = {
      presets: document.getElementById("presets"),
      catalog: document.getElementById("catalog"),
      manageBox: document.getElementById("manageBox"),
      toggleManage: document.getElementById("toggleManage"),
      addCatalog: document.getElementById("addCatalog"),
      saveCatalog: document.getElementById("saveCatalog"),
      catalogStatus: document.getElementById("catalogStatus"),
      items: document.getElementById("items"),
      addItem: document.getElementById("addItem"),
      docTitle: document.getElementById("docTitle"),
      note: document.getElementById("note"),
      sumText: document.getElementById("sumText"),
      client: document.getElementById("client"),
      date: document.getElementById("date"),
      pin: document.getElementById("pin"),
      sendEmail: document.getElementById("sendEmail"),
      emailTo: document.getElementById("emailTo"),
      emailCc: document.getElementById("emailCc"),
      subject: document.getElementById("subject"),
      emailHint: document.getElementById("emailHint"),
      form: document.getElementById("form"),
      submitBtn: document.getElementById("submitBtn"),
      status: document.getElementById("status"),
    };

    let catalog = [];
    let rows = [];
    let photoPackageIds = [];

    function todayLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function money(n) {
      return Math.round(Number(n) || 0).toLocaleString("ko-KR");
    }
    function escapeAttr(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;");
    }
    function uid() {
      return "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }
    function blankRow() {
      return { name: "", spec: "", unit: "식", qty: 1, unitPriceIncl: 0 };
    }
    function blankCatalog() {
      return {
        id: uid(),
        title: "",
        name: "",
        spec: "",
        unit: "식",
        qty: 1,
        unitPriceIncl: 0,
      };
    }

    function calcSum() {
      const sum = rows.reduce((s, r) => s + Number(r.qty || 0) * Number(r.unitPriceIncl || 0), 0);
      els.sumText.textContent = money(sum) + "원";
    }

    function readDomIntoRows() {
      rows = [...els.items.querySelectorAll(".item")].map((card) => ({
        name: card.querySelector(".f-name").value.trim(),
        spec: card.querySelector(".f-spec").value.trim(),
        unit: card.querySelector(".f-unit").value.trim() || "식",
        qty: Number(card.querySelector(".f-qty").value || 0),
        unitPriceIncl: Number(card.querySelector(".f-price").value || 0),
      }));
      calcSum();
    }

    function renderRows() {
      els.items.innerHTML = rows
        .map(
          (r, i) => `<div class="item">
            <div class="top">
              <strong>품목 ${i + 1}</strong>
              <button type="button" class="del" data-del="${i}">삭제</button>
            </div>
            <label>품명</label>
            <input class="f-name" type="text" value="${escapeAttr(r.name)}" />
            <label>규격/설명</label>
            <input class="f-spec" type="text" value="${escapeAttr(r.spec)}" />
            <div class="row3">
              <div><label>단위</label><input class="f-unit" type="text" value="${escapeAttr(r.unit || "식")}" /></div>
              <div><label>수량</label><input class="f-qty" type="number" step="1" min="0" value="${r.qty}" /></div>
              <div><label>단가(부가세포함)</label><input class="f-price" type="number" step="1000" min="0" value="${r.unitPriceIncl}" /></div>
            </div>
          </div>`
        )
        .join("");
      els.items.querySelectorAll("input").forEach((el) => el.addEventListener("input", readDomIntoRows));
      els.items.querySelectorAll("[data-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          readDomIntoRows();
          rows.splice(Number(btn.dataset.del), 1);
          if (!rows.length) rows = [blankRow()];
          renderRows();
        });
      });
      calcSum();
    }

    function readCatalogFromDom() {
      catalog = [...els.catalog.querySelectorAll(".cat-item")].map((card) => ({
        id: card.dataset.id || uid(),
        title: card.querySelector(".c-title").value.trim(),
        name: card.querySelector(".c-name").value.trim(),
        spec: card.querySelector(".c-spec").value.trim(),
        unit: card.querySelector(".c-unit").value.trim() || "식",
        qty: Number(card.querySelector(".c-qty").value || 1),
        unitPriceIncl: Number(card.querySelector(".c-price").value || 0),
      }));
    }

    function renderCatalogEditor() {
      els.catalog.innerHTML = catalog
        .map(
          (p, i) => `<div class="cat-item" data-id="${escapeAttr(p.id)}">
            <div class="top">
              <strong>메뉴 ${i + 1}</strong>
              <button type="button" class="del" data-cat-del="${i}">삭제</button>
            </div>
            <label>메뉴 버튼 이름 (네비게이션에 표시)</label>
            <input class="c-title" type="text" value="${escapeAttr(p.title)}" placeholder="예: 전사 유니폼 상의" />
            <label>서류 품명</label>
            <input class="c-name" type="text" value="${escapeAttr(p.name)}" placeholder="예: 전사 유니폼 상의" />
            <label>규격/설명</label>
            <input class="c-spec" type="text" value="${escapeAttr(p.spec)}" />
            <div class="row3">
              <div><label>단위</label><input class="c-unit" type="text" value="${escapeAttr(p.unit || "식")}" /></div>
              <div><label>기본수량</label><input class="c-qty" type="number" step="1" min="1" value="${p.qty || 1}" /></div>
              <div><label>단가(부가세포함)</label><input class="c-price" type="number" step="1000" min="0" value="${p.unitPriceIncl || 0}" /></div>
            </div>
          </div>`
        )
        .join("");
      els.catalog.querySelectorAll("[data-cat-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          readCatalogFromDom();
          catalog.splice(Number(btn.dataset.catDel), 1);
          renderCatalogEditor();
          renderPresetButtons();
        });
      });
    }

    function renderPresetButtons() {
      els.presets.innerHTML = catalog
        .map(
          (p) =>
            `<button type="button" data-preset="${escapeAttr(p.id)}">${escapeAttr(p.title || p.name)}<div class="price-tag">${money(p.unitPriceIncl)}원</div></button>`
        )
        .join("");
      els.presets.querySelectorAll("[data-preset]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const p = catalog.find((x) => x.id === btn.dataset.preset);
          if (!p) return;
          readDomIntoRows();
          rows = [
            ...rows.filter((r) => r.name || r.unitPriceIncl),
            {
              name: p.name || p.title,
              spec: p.spec || "",
              unit: p.unit || "식",
              qty: Number(p.qty) || 1,
              unitPriceIncl: Number(p.unitPriceIncl) || 0,
            },
          ];
          if (!rows.length) rows = [blankRow()];
          if (!photoPackageIds.includes(p.id)) photoPackageIds.push(p.id);
          if (!els.docTitle.value || els.docTitle.value === "납품") {
            els.docTitle.value = p.title || p.name;
          } else if (p.title && !els.docTitle.value.includes(p.title)) {
            els.docTitle.value += " / " + p.title;
          }
          renderRows();
        });
      });
    }

    function showCatalogStatus(type, text) {
      els.catalogStatus.className = "status show " + type;
      els.catalogStatus.textContent = text;
    }

    function showStatus(type, html) {
      els.status.className = "status show " + type;
      els.status.innerHTML = html;
    }

    async function loadCatalog() {
      let list = [];
      try {
        const res = await fetch("/api/presets");
        const data = await res.json();
        if (data.ok && Array.isArray(data.presets)) list = data.presets;
      } catch (_) {}
      if (!list.length) {
        try {
          list = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        } catch (_) {
          list = [];
        }
      }
      if (!list.length) {
        const meta = await fetch("/api/meta").then((r) => r.json());
        list = (meta.packages || []).map((p) => ({
          id: p.id,
          title: p.title,
          name: (p.items && p.items[0] && p.items[0].name) || p.title,
          spec: (p.items && p.items[0] && p.items[0].spec) || "",
          unit: (p.items && p.items[0] && p.items[0].unit) || "식",
          qty: (p.items && p.items[0] && p.items[0].qty) || 1,
          unitPriceIncl: (p.items && p.items[0] && p.items[0].unitPriceIncl) || 0,
        }));
      }
      catalog = list;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog));
      renderPresetButtons();
      renderCatalogEditor();
    }

    async function init() {
      const meta = await fetch("/api/meta").then((r) => r.json());
      els.client.value = meta.clientDefault || "";
      els.date.value = todayLocal();
      els.emailHint.textContent = meta.emailConfigured
        ? `발송 가능 (${meta.emailProvider || "설정됨"})`
        : "이메일 미설정";
      await loadCatalog();
      rows = [blankRow()];
      renderRows();
      els.emailTo.required = els.sendEmail.checked;
    }

    els.toggleManage.addEventListener("click", () => {
      els.manageBox.classList.toggle("hidden");
      const closed = els.manageBox.classList.contains("hidden");
      els.toggleManage.textContent = closed
        ? "네비게이션 등록 · 수정 · 삭제"
        : "메뉴 편집 닫기";
    });
    els.addCatalog.addEventListener("click", () => {
      readCatalogFromDom();
      catalog.push(blankCatalog());
      renderCatalogEditor();
      els.manageBox.classList.remove("hidden");
    });
    els.saveCatalog.addEventListener("click", async () => {
      readCatalogFromDom();
      const cleaned = catalog.filter((p) => p.title || p.name);
      if (!cleaned.length) {
        showCatalogStatus("err", "메뉴를 1개 이상 등록하세요.");
        return;
      }
      if (!els.pin.value) {
        showCatalogStatus("err", "위에 접속 비밀번호를 먼저 입력하세요.");
        return;
      }
      cleaned.forEach((p) => {
        if (!p.title) p.title = p.name;
        if (!p.name) p.name = p.title;
      });
      catalog = cleaned;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog));
      renderPresetButtons();
      renderCatalogEditor();
      try {
        const res = await fetch("/api/presets", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: els.pin.value, presets: catalog }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "저장 실패");
        catalog = data.presets;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(catalog));
        renderPresetButtons();
        renderCatalogEditor();
        showCatalogStatus("ok", "네비게이션 메뉴 저장 완료 · 위 버튼이 갱신됐습니다");
      } catch (err) {
        showCatalogStatus("err", err.message + " (이 폰에는 임시 저장됨)");
      }
    });

    els.addItem.addEventListener("click", () => {
      readDomIntoRows();
      rows.push(blankRow());
      renderRows();
    });
    els.sendEmail.addEventListener("change", () => {
      els.emailTo.required = els.sendEmail.checked;
      els.submitBtn.textContent = els.sendEmail.checked ? "PDF 만들고 보내기" : "PDF만 만들기";
    });

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      readDomIntoRows();
      const customItems = rows.filter((r) => r.name);
      if (!customItems.length) {
        showStatus("err", "품명을 1개 이상 입력하세요.");
        return;
      }
      els.submitBtn.disabled = true;
      showStatus("ok", "생성 중… 잠시만 기다려 주세요.");
      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pin: els.pin.value,
            title: els.docTitle.value.trim() || "납품",
            note: els.note.value.trim(),
            customItems,
            photoPackageIds,
            client: els.client.value.trim(),
            date: els.date.value || todayLocal(),
            emailTo: els.emailTo.value.trim(),
            emailCc: els.emailCc.value.trim(),
            subject: els.subject.value.trim(),
            sendEmail: els.sendEmail.checked,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "실패");
        showStatus(
          data.emailError ? "err" : "ok",
          [
            `완료: ${data.fileName}`,
            `합계: ${money(data.totalSum)}원`,
            data.emailed ? "이메일 발송 완료" : data.emailError || "이메일 미발송 (다운로드만)",
            `<a href="${data.downloadUrl}" download>PDF 다운로드</a>`,
          ].join("\n")
        );
      } catch (err) {
        showStatus("err", err.message || String(err));
      } finally {
        els.submitBtn.disabled = false;
      }
    });

    init().catch((err) => showStatus("err", err.message));
  </script>
</body>
</html>
