<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>위캔 납품서류</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3848;
      --text: #eef3f8;
      --muted: #93a4b8;
      --accent: #1f8a70;
      --accent-2: #f0b429;
      --danger: #e35d6a;
      --ok: #3ecf8e;
      --radius: 14px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 10% -10%, #1d3a33 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #2a2416 0%, transparent 50%),
        var(--bg);
      padding: 20px 16px 40px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    header {
      margin-bottom: 18px;
    }
    header .brand {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }
    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="number"],
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .pkg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 8px;
      background: #12181f;
    }
    .pkg input { margin-top: 3px; width: 18px; height: 18px; }
    .pkg .meta { flex: 1; min-width: 0; }
    .pkg .title { font-weight: 700; font-size: 15px; }
    .pkg .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .checks {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 4px;
    }
    .checks label.inline {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      margin: 0;
    }
    .checks input { width: 18px; height: 18px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary {
      background: linear-gradient(180deg, #2aa883, var(--accent));
      color: #fff;
    }
    button.primary:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    button.ghost {
      margin-top: 8px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .status {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .status.show { display: block; }
    .status.ok {
      background: color-mix(in srgb, var(--ok) 18%, #12181f);
      border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent);
      color: #d8ffe9;
    }
    .status.err {
      background: color-mix(in srgb, var(--danger) 18%, #12181f);
      border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
      color: #ffd6db;
    }
    .status a { color: var(--accent-2); }
    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: -4px;
      margin-bottom: 10px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">WECAN</div>
      <h1>납품서류 만들기</h1>
      <p>어디서든 품목 선택 → PDF 생성 → 이메일 발송. 홈화면에 추가해 두면 앱처럼 쓸 수 있습니다.</p>
    </header>

    <form id="form">
      <div class="card">
        <h2>접속</h2>
        <label for="pin">비밀번호</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="FORM_PIN" required />
      </div>

      <div class="card">
        <h2>품목</h2>
        <div id="packages"></div>
        <div id="rentalFields" class="hidden">
          <div class="row">
            <div>
              <label for="rentalDaily">일 단가(부가세포함)</label>
              <input id="rentalDaily" type="number" step="1000" />
            </div>
            <div>
              <label for="rentalDays">일수</label>
              <input id="rentalDays" type="number" min="1" step="1" />
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>수신 / 일자</h2>
        <label for="client">수신처</label>
        <input id="client" type="text" />
        <label for="date">작성일자</label>
        <input id="date" type="date" />
      </div>

      <div class="card">
        <h2>이메일</h2>
        <div class="checks">
          <label class="inline"><input id="sendEmail" type="checkbox" checked /> PDF를 이메일로 보내기</label>
        </div>
        <label for="emailTo">받는 사람</label>
        <input id="emailTo" type="email" placeholder="example@email.com" />
        <label for="emailCc">참조(선택)</label>
        <input id="emailCc" type="email" placeholder="cc@email.com" />
        <label for="subject">제목(선택)</label>
        <input id="subject" type="text" placeholder="비우면 자동 생성" />
        <p class="hint" id="emailHint"></p>
      </div>

      <button class="primary" id="submitBtn" type="submit">PDF 만들고 보내기</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const els = {
      packages: document.getElementById("packages"),
      rentalFields: document.getElementById("rentalFields"),
      rentalDaily: document.getElementById("rentalDaily"),
      rentalDays: document.getElementById("rentalDays"),
      client: document.getElementById("client"),
      date: document.getElementById("date"),
      pin: document.getElementById("pin"),
      sendEmail: document.getElementById("sendEmail"),
      emailTo: document.getElementById("emailTo"),
      emailCc: document.getElementById("emailCc"),
      subject: document.getElementById("subject"),
      emailHint: document.getElementById("emailHint"),
      form: document.getElementById("form"),
      submitBtn: document.getElementById("submitBtn"),
      status: document.getElementById("status"),
    };

    let meta = null;

    function money(n) {
      return Math.round(n).toLocaleString("ko-KR");
    }

    function selectedIds() {
      return [...document.querySelectorAll(".pkg-check:checked")].map((el) => el.value);
    }

    function syncRental() {
      const on = selectedIds().includes("3_지주대임대");
      els.rentalFields.classList.toggle("hidden", !on);
    }

    function syncEmailRequired() {
      els.emailTo.required = els.sendEmail.checked;
      els.submitBtn.textContent = els.sendEmail.checked
        ? "PDF 만들고 보내기"
        : "PDF만 만들기";
    }

    function showStatus(type, html) {
      els.status.className = "status show " + type;
      els.status.innerHTML = html;
    }

    async function loadMeta() {
      const res = await fetch("/api/meta");
      meta = await res.json();
      els.client.value = meta.clientDefault;
      els.date.value = meta.dateDefault;
      els.emailHint.textContent = meta.emailConfigured
        ? "SMTP 설정됨 · 발송 가능"
        : "SMTP 미설정 · .env 채운 뒤 재실행 (지금은 PDF 생성/다운로드만 가능)";

      els.packages.innerHTML = meta.packages
        .map((p) => {
          const sub =
            p.id === "3_지주대임대"
              ? `기본 ${money(p.defaultDailyIncl)}원 × ${p.defaultDays}일`
              : `기본 ${money(p.defaultTotalIncl)}원`;
          const amountField =
            p.id === "3_지주대임대"
              ? ""
              : `<label style="margin-top:8px">금액(부가세포함)
                  <input class="pkg-total" data-id="${p.id}" type="number" step="1000" value="${p.defaultTotalIncl}" />
                 </label>`;
          return `<div class="pkg">
            <input class="pkg-check" type="checkbox" value="${p.id}" checked />
            <div class="meta">
              <div class="title">${p.title}</div>
              <div class="sub">${sub}</div>
              ${amountField}
            </div>
          </div>`;
        })
        .join("");

      els.rentalDaily.value = meta.packages.find((p) => p.id === "3_지주대임대").defaultDailyIncl;
      els.rentalDays.value = meta.packages.find((p) => p.id === "3_지주대임대").defaultDays;

      document.querySelectorAll(".pkg-check").forEach((el) => {
        el.addEventListener("change", syncRental);
      });
      syncRental();
      syncEmailRequired();
    }

    els.sendEmail.addEventListener("change", syncEmailRequired);

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const packageIds = selectedIds();
      if (!packageIds.length) {
        showStatus("err", "품목을 1개 이상 선택하세요.");
        return;
      }

      const totals = {};
      document.querySelectorAll(".pkg-total").forEach((el) => {
        totals[el.dataset.id] = Number(el.value);
      });

      const payload = {
        pin: els.pin.value,
        packageIds,
        client: els.client.value.trim(),
        date: els.date.value,
        totals,
        rentalDailyIncl: Number(els.rentalDaily.value),
        rentalDays: Number(els.rentalDays.value),
        emailTo: els.emailTo.value.trim(),
        emailCc: els.emailCc.value.trim(),
        subject: els.subject.value.trim(),
        sendEmail: els.sendEmail.checked,
      };

      els.submitBtn.disabled = true;
      showStatus("ok", "생성 중… 잠시만 기다려 주세요.");

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "실패");

        const lines = [
          `완료: ${data.fileName}`,
          `합계: ${money(data.totalSum)}원`,
          data.emailed ? "이메일 발송 완료" : "이메일 미발송 (다운로드만)",
          `<a href="${data.downloadUrl}" download>PDF 다운로드</a>`,
        ];
        showStatus("ok", lines.join("\n"));
      } catch (err) {
        showStatus("err", err.message || String(err));
      } finally {
        els.submitBtn.disabled = false;
      }
    });

    loadMeta().catch((err) => showStatus("err", err.message));
  </script>
</body>
</html>
