services:
  - type: web
    name: wecan-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/meta
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PUBLIC_URL
        value: https://wecan-docs.onrender.com
