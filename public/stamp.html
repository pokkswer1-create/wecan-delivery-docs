<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>온라인 도장 · 위캔</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3848;
      --text: #eef3f8;
      --muted: #93a4b8;
      --accent: #1f8a70;
      --accent-2: #f0b429;
      --stamp: #e31c23;
      --radius: 14px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1000px 420px at 8% -8%, #3a1d1d 0%, transparent 55%),
        radial-gradient(800px 360px at 100% 0%, #1d3a33 0%, transparent 50%),
        var(--bg);
      padding: 20px 16px 48px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .app-nav, .mode-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 16px;
      padding: 4px;
      background: #12181f;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .app-nav a, .mode-nav button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      padding: 11px 8px;
      border-radius: 9px;
      border: 0;
      background: transparent;
      font-family: inherit;
      cursor: pointer;
      margin: 0;
    }
    .app-nav a.active, .mode-nav button.active {
      background: color-mix(in srgb, var(--accent) 28%, #1a222c);
      color: var(--text);
    }
    header .brand {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }
    header p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .hidden { display: none !important; }
    .picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .font-col {
      background: #fff;
      border: 2px solid #d8dde5;
      border-radius: 10px;
      padding: 8px 6px 10px;
      cursor: pointer;
      text-align: center;
    }
    .font-col.selected {
      border-color: var(--stamp);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--stamp) 35%, transparent);
    }
    .font-col .radio {
      width: 16px;
      height: 16px;
      border: 2px solid #9aa3b2;
      border-radius: 50%;
      margin: 0 auto 8px;
      position: relative;
    }
    .font-col.selected .radio { border-color: var(--stamp); }
    .font-col.selected .radio::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--stamp);
    }
    .font-col .grid4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 8px;
    }
    .font-col .grid4 button {
      width: 100%;
      aspect-ratio: 1;
      margin: 0;
      padding: 2px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .font-col .grid4 button.on {
      border-color: var(--stamp);
      background: #fff5f5;
    }
    .font-col .grid4 canvas { width: 100%; height: 100%; display: block; }
    .font-col .fname { color: #222; font-size: 12px; font-weight: 700; }
    .corp-shapes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .corp-shape {
      background: #fff;
      border: 2px solid #d8dde5;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
    }
    .corp-shape.on {
      border-color: var(--stamp);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--stamp) 35%, transparent);
    }
    .corp-shape canvas {
      width: 100%;
      max-width: 140px;
      aspect-ratio: 1;
      display: block;
      margin: 0 auto 8px;
    }
    .corp-shape span {
      color: #222;
      font-size: 13px;
      font-weight: 700;
    }
    .preview-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 240px;
      background: #111;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
    }
    #preview {
      width: 220px;
      height: 220px;
      max-width: 100%;
    }
    button.action {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.primary {
      background: linear-gradient(180deg, #2aa889, var(--accent));
      color: #fff;
    }
    button.ghost {
      background: #12181f;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.danger {
      background: color-mix(in srgb, #e35d6a 25%, #12181f);
      color: #ffc9cf;
      border: 1px solid color-mix(in srgb, #e35d6a 50%, var(--line));
    }
    .hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .status { min-height: 20px; font-size: 13px; margin-top: 4px; }
    .status.ok { color: #3ecf8e; }
    .status.err { color: #e35d6a; }
    .steps {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .sel-label {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: -4px 0 10px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: -4px 0 12px;
    }
    .chips button {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="app-nav" aria-label="주요 메뉴">
      <a href="/">납품서류</a>
      <a class="active" href="/stamp.html" aria-current="page">온라인 도장</a>
    </nav>
    <header>
      <div class="brand">WECAN</div>
      <h1>온라인 도장</h1>
      <p>개인 도장과 기업(법인) 도장을 만들고 서류에 적용할 수 있습니다.</p>
    </header>

    <div class="mode-nav" role="tablist">
      <button type="button" class="active" data-mode="personal" id="modePersonal">개인 도장</button>
      <button type="button" data-mode="corp" id="modeCorp">기업 도장</button>
    </div>

    <div class="card" id="personalCard">
      <h2>개인 도장</h2>
      <label for="name">이름</label>
      <input id="name" type="text" maxlength="4" placeholder="예: 김강선" value="김강선" />
      <label>도장 모양 선택</label>
      <p class="hint">굴림·궁서·바탕 / 원형·사각 / 한글·한자</p>
      <div class="picker" id="picker"></div>
      <div class="sel-label" id="selLabel"></div>
    </div>

    <div class="card hidden" id="corpCard">
      <h2>기업 도장</h2>
      <label for="company">회사명 (바깥 원 글자)</label>
      <input id="company" type="text" maxlength="16" placeholder="예: 주식회사위캔" value="주식회사위캔" />
      <label for="center">중앙 문구 (원형)</label>
      <input id="center" type="text" maxlength="6" placeholder="예: 대표이사 / 代表理事" value="代表理事" />
      <div class="chips" id="centerChips">
        <button type="button" data-center="代表理事">代表理事</button>
        <button type="button" data-center="대표이사">대표이사</button>
        <button type="button" data-center="使用認印">使用認印</button>
        <button type="button" data-center="사용인감">사용인감</button>
      </div>
      <div class="opts-row" style="display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px;font-size:13px">
        <label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--text);cursor:pointer">
          <input type="checkbox" id="inkTexture" checked style="width:auto;margin:0" /> 실인 질감
        </label>
        <label style="display:flex;align-items:center;gap:6px;margin:0;color:var(--text);cursor:pointer">
          <input type="checkbox" id="centerHanja" checked style="width:auto;margin:0" /> 중앙 자동 한자
        </label>
      </div>
      <label>기업 도장 형태</label>
      <div class="corp-shapes" id="corpShapes"></div>
      <div class="sel-label" id="corpSelLabel"></div>
    </div>

    <div class="card">
      <div class="preview-wrap">
        <canvas id="preview" width="640" height="640"></canvas>
      </div>
      <button class="action primary" type="button" id="makeBtn">도장 만들기</button>
      <button class="action ghost" type="button" id="downloadBtn">이미지로 저장하기</button>
    </div>

    <div class="card">
      <h2>납품서류에 적용</h2>
      <p class="hint">만든 도장을 견적서·납품서·거래명세서 서명란에 사용합니다.</p>
      <label for="pin">접속 비밀번호</label>
      <input id="pin" type="password" autocomplete="current-password" />
      <button class="action primary" type="button" id="applyBtn">서류 도장으로 적용</button>
      <button class="action danger" type="button" id="resetBtn">기본 도장으로 되돌리기</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <h2>이용방법</h2>
      <ol class="steps">
        <li>개인 / 기업 도장 탭을 고릅니다.</li>
        <li>이름·회사명과 원하는 형태를 선택합니다.</li>
        <li>저장하거나 서류에 적용합니다.</li>
      </ol>
    </div>
  </div>

  <script>
    const INK = "#e31c23";
    const SEAL_FONT = 'Gungsuh, Batang, "Apple Myungjo", "Malgun Gothic", serif';
    const FONTS = [
      { key: "gulim", label: "굴림체", family: 'Gulim, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif', weight: "700" },
      { key: "gungseo", label: "궁서체", family: 'Gungsuh, Batang, "Apple Myungjo", serif', weight: "700" },
      { key: "batang", label: "바탕체", family: 'Batang, "Apple Myungjo", serif', weight: "700" },
    ];
    const SURNAME = {
      김: "金", 이: "李", 박: "朴", 최: "崔", 정: "鄭", 강: "姜", 조: "趙", 윤: "尹",
      장: "張", 임: "林", 한: "韓", 오: "吳", 서: "徐", 신: "申", 권: "權", 황: "黃",
      안: "安", 송: "宋", 전: "全", 홍: "洪", 유: "柳", 고: "高", 문: "文", 양: "梁",
      손: "孫", 배: "裵", 백: "白", 허: "許", 남: "南", 심: "沈", 노: "盧", 하: "河",
      곽: "郭", 성: "成", 차: "車", 주: "周", 우: "禹", 구: "具", 민: "閔", 류: "柳",
      진: "陳", 엄: "嚴", 원: "元", 채: "蔡",
    };
    const GIVEN = {
      강: "康", 선: "善", 길: "吉", 동: "東", 영: "英", 수: "秀", 호: "浩", 준: "俊",
      현: "賢", 우: "祐", 재: "宰", 석: "錫", 훈: "勳", 태: "泰", 경: "京", 환: "煥",
      민: "敏", 지: "智", 혜: "慧", 은: "恩", 아: "雅", 연: "姸", 윤: "允", 나: "娜",
      미: "美", 정: "姃", 희: "喜", 숙: "淑", 순: "順", 철: "哲", 용: "勇", 기: "基",
      성: "成", 진: "眞", 서: "瑞", 인: "印",
    };
    const VARIANTS = [
      { shape: "circle", script: "hangul", title: "원형 한글" },
      { shape: "square", script: "hangul", title: "사각 한글" },
      { shape: "circle", script: "hanja", title: "원형 한자" },
      { shape: "square", script: "hanja", title: "사각 한자" },
    ];

    const els = {
      personalCard: document.getElementById("personalCard"),
      corpCard: document.getElementById("corpCard"),
      name: document.getElementById("name"),
      company: document.getElementById("company"),
      center: document.getElementById("center"),
      picker: document.getElementById("picker"),
      corpShapes: document.getElementById("corpShapes"),
      preview: document.getElementById("preview"),
      selLabel: document.getElementById("selLabel"),
      corpSelLabel: document.getElementById("corpSelLabel"),
      makeBtn: document.getElementById("makeBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      applyBtn: document.getElementById("applyBtn"),
      resetBtn: document.getElementById("resetBtn"),
      pin: document.getElementById("pin"),
      status: document.getElementById("status"),
      modePersonal: document.getElementById("modePersonal"),
      modeCorp: document.getElementById("modeCorp"),
    };

    let mode = "personal";
    let selected = { font: "gulim", shape: "circle", script: "hangul" };
    let corpShape = "circle"; // circle | square
    let lastDataUrl = "";
    let lastText = "";

    function onlyChars(s) {
      return String(s || "").replace(/\s+/g, "");
    }

    function hangulStampText() {
      let n = onlyChars(els.name.value).slice(0, 4);
      if (!n) return "";
      if (!n.endsWith("인") && n.length < 4) n += "인";
      return n.slice(0, 4);
    }

    function toHanjaChar(ch, index) {
      if (ch === "인") return "印";
      if (index === 0 && SURNAME[ch]) return SURNAME[ch];
      if (GIVEN[ch]) return GIVEN[ch];
      if (SURNAME[ch]) return SURNAME[ch];
      return ch;
    }

    function hanjaStampText() {
      const h = hangulStampText();
      return [...h].map((ch, i) => toHanjaChar(ch, i)).join("");
    }

    function stampTextFor(script) {
      return script === "hanja" ? hanjaStampText() : hangulStampText();
    }

    function fontMeta(key) {
      return FONTS.find((f) => f.key === key) || FONTS[0];
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawPersonalStamp(canvas, text, fontKey, shapeKind, size) {
      const ctx = canvas.getContext("2d");
      const s = size || canvas.width;
      canvas.width = s;
      canvas.height = s;
      ctx.clearRect(0, 0, s, s);
      const cx = s / 2;
      const cy = s / 2;
      ctx.strokeStyle = INK;
      ctx.fillStyle = INK;
      ctx.lineWidth = Math.max(2, s * 0.045);
      if (shapeKind === "square") {
        const pad = s * 0.08;
        roundRect(ctx, pad, pad, s - pad * 2, s - pad * 2, s * 0.08);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.42, 0, Math.PI * 2);
        ctx.stroke();
      }
      const chars = [...text];
      while (chars.length < 4) chars.push("");
      const show = chars.slice(0, 4);
      const font = fontMeta(fontKey);
      const fontSize = s * 0.28;
      ctx.font = `700 ${fontSize}px ${font.family}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const gap = s * 0.22;
      const positions = [
        [cx - gap / 2, cy - gap / 2],
        [cx + gap / 2, cy - gap / 2],
        [cx - gap / 2, cy + gap / 2],
        [cx + gap / 2, cy + gap / 2],
      ];
      show.forEach((ch, i) => {
        if (ch) ctx.fillText(ch, positions[i][0], positions[i][1] + s * 0.01);
      });
    }

    function drawRingText(ctx, text, cx, cy, radius, fontSize) {
      let chars = [...onlyChars(text)];
      if (!chars.length) return;
      // 상단 ★ 마커 + 회사명 (참고 이미지 스타일)
      const ring = ["★", ...chars];
      const n = ring.length;
      ctx.fillStyle = INK;
      ctx.font = `800 ${fontSize}px "Malgun Gothic", Gulim, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (let i = 0; i < n; i++) {
        // 12시 방향부터 시계방향
        const a = -Math.PI / 2 + (i / n) * Math.PI * 2;
        ctx.save();
        ctx.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
        ctx.rotate(a + Math.PI / 2);
        const ch = ring[i];
        if (ch === "★") {
          ctx.beginPath();
          ctx.arc(0, 0, fontSize * 0.28, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillText(ch, 0, 0);
        }
        ctx.restore();
      }
    }

    // 중앙 4글자: 전통 인감처럼 오른쪽 열 → 왼쪽 열 (위에서 아래)
    function drawCenterGrid(ctx, text, cx, cy, box, fontSize) {
      let chars = [...onlyChars(text)].slice(0, 4);
      while (chars.length < 4) chars.push("");
      // chars order: [우상, 우하, 좌상, 좌하] after remap from reading order 代表理事
      // input 代表理事 or 대표이사 → display:
      //   理 代
      //   事 表
      const c0 = chars[0] || "";
      const c1 = chars[1] || "";
      const c2 = chars[2] || "";
      const c3 = chars[3] || "";
      const layout = [
        [c2, c0], // top: left=理, right=代
        [c3, c1], // bottom: left=事, right=表
      ];
      ctx.fillStyle = INK;
      ctx.font = `900 ${fontSize}px ${SEAL_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const gap = box * 0.48;
      for (let r = 0; r < 2; r++) {
        for (let c = 0; c < 2; c++) {
          const ch = layout[r][c];
          if (!ch) continue;
          const x = cx + (c === 0 ? -gap / 2 : gap / 2);
          const y = cy + (r === 0 ? -gap / 2 : gap / 2);
          ctx.fillText(ch, x, y);
        }
      }
    }

    const CENTER_HANJA = {
      대: "代", 표: "表", 이: "理", 사: "事",
      용: "用", 인: "印", 감: "鑑", 직: "職", 회: "會", 장: "長",
      使: "使", 用: "用", 認: "認", 印: "印",
      代: "代", 表: "表", 理: "理", 事: "事",
    };

    function centerToHanja(text) {
      const raw = onlyChars(text);
      if (!raw) return "代表理事";
      // 이미 한자면 그대로
      if (/^[\u4e00-\u9fff]+$/.test(raw)) return raw.slice(0, 4);
      const mapPhrase = {
        대표이사: "代表理事",
        사용인감: "使用認印",
        법인인감: "法人認印",
        직인: "職印",
      };
      if (mapPhrase[raw]) return mapPhrase[raw];
      return [...raw].map((ch) => CENTER_HANJA[ch] || ch).join("").slice(0, 4);
    }

    function applyInkTexture(ctx, s) {
      // 대각선 스크래치 + 노이즈로 실인 느낌
      const img = ctx.getImageData(0, 0, s, s);
      const d = img.data;
      for (let y = 0; y < s; y++) {
        for (let x = 0; x < s; x++) {
          const i = (y * s + x) * 4;
          if (d[i + 3] < 10) continue;
          const scratch = ((x + y * 1.7) % 7) < 1.2 ? 0.55 : 1;
          const n = Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
          const noise = 0.72 + n * 0.35;
          const m = scratch * noise;
          d[i] = Math.min(255, d[i] * m + (1 - m) * 255 * 0.15);
          d[i + 1] = Math.min(255, d[i + 1] * m);
          d[i + 2] = Math.min(255, d[i + 2] * m);
          d[i + 3] = Math.floor(d[i + 3] * (0.82 + n * 0.18));
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    function drawCorpCircle(canvas, company, center, size, opts) {
      const ctx = canvas.getContext("2d");
      const s = size || canvas.width;
      canvas.width = s;
      canvas.height = s;
      ctx.clearRect(0, 0, s, s);
      const cx = s / 2;
      const cy = s / 2;
      const outerR = s * 0.455;
      const innerR = s * 0.275;
      const useTexture = !opts || opts.texture !== false;
      const useHanja = !opts || opts.hanja !== false;

      ctx.strokeStyle = INK;
      ctx.fillStyle = INK;
      ctx.lineWidth = Math.max(3, s * 0.022);
      ctx.beginPath();
      ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = Math.max(2.5, s * 0.018);
      ctx.beginPath();
      ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
      ctx.stroke();

      const name = onlyChars(company) || "주식회사위캔";
      const ringR = (outerR + innerR) / 2;
      const ringFont = Math.min(
        s * 0.078,
        (2 * Math.PI * ringR) / Math.max(name.length + 1, 6) * 0.78
      );
      drawRingText(ctx, name, cx, cy, ringR, ringFont);

      let centerText = onlyChars(center) || "代表理事";
      if (useHanja) centerText = centerToHanja(centerText);
      drawCenterGrid(ctx, centerText, cx, cy, innerR * 1.65, s * 0.145);

      if (useTexture) applyInkTexture(ctx, s);
    }

    function gridSizeFor(len) {
      if (len <= 4) return 2;
      if (len <= 9) return 3;
      return 4;
    }

    function charsToGrid(chars, n) {
      // 전통 직인: 오른쪽 열부터 위에서 아래로
      const grid = Array.from({ length: n }, () => Array(n).fill(""));
      let i = 0;
      for (let col = n - 1; col >= 0; col--) {
        for (let row = 0; row < n; row++) {
          grid[row][col] = chars[i++] || "";
        }
      }
      return grid;
    }

    function drawCorpSquare(canvas, company, size) {
      const ctx = canvas.getContext("2d");
      const s = size || canvas.width;
      canvas.width = s;
      canvas.height = s;
      ctx.clearRect(0, 0, s, s);
      const chars = [...onlyChars(company)].slice(0, 16);
      const n = gridSizeFor(Math.max(chars.length, 4));
      while (chars.length < n * n) chars.push("");
      const pad = s * 0.06;
      const outer = s - pad * 2;
      const inset = s * 0.035;
      ctx.strokeStyle = INK;
      ctx.fillStyle = INK;
      ctx.lineWidth = Math.max(3, s * 0.028);
      ctx.strokeRect(pad, pad, outer, outer);
      ctx.lineWidth = Math.max(2, s * 0.014);
      ctx.strokeRect(pad + inset, pad + inset, outer - inset * 2, outer - inset * 2);

      const innerPad = pad + inset * 1.6;
      const cell = (s - innerPad * 2) / n;
      const fontSize = cell * 0.72;
      ctx.font = `800 ${fontSize}px ${SEAL_FONT}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const grid = charsToGrid(chars, n);
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const ch = grid[r][c];
          if (!ch) continue;
          const x = innerPad + c * cell + cell / 2;
          const y = innerPad + r * cell + cell / 2;
          ctx.fillText(ch, x, y + cell * 0.02);
        }
      }
    }

    function renderPersonalPicker() {
      const sampleHangul = hangulStampText() || "홍길동인";
      const sampleHanja = hanjaStampText() || "洪吉東印";
      els.picker.innerHTML = "";
      FONTS.forEach((font) => {
        const col = document.createElement("div");
        col.className = "font-col" + (selected.font === font.key ? " selected" : "");
        col.innerHTML = `<div class="radio"></div><div class="grid4"></div><div class="fname">${font.label}</div>`;
        const grid = col.querySelector(".grid4");
        VARIANTS.forEach((v) => {
          const btn = document.createElement("button");
          btn.type = "button";
          if (
            selected.font === font.key &&
            selected.shape === v.shape &&
            selected.script === v.script
          ) {
            btn.classList.add("on");
          }
          const c = document.createElement("canvas");
          c.width = 128;
          c.height = 128;
          drawPersonalStamp(
            c,
            v.script === "hanja" ? sampleHanja : sampleHangul,
            font.key,
            v.shape,
            128
          );
          btn.appendChild(c);
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            selected = { font: font.key, shape: v.shape, script: v.script };
            renderPersonalPicker();
            make(false);
          });
          grid.appendChild(btn);
        });
        col.addEventListener("click", () => {
          selected.font = font.key;
          renderPersonalPicker();
          make(false);
        });
        els.picker.appendChild(col);
      });
    }

    function corpOpts() {
      return {
        texture: document.getElementById("inkTexture")?.checked !== false,
        hanja: document.getElementById("centerHanja")?.checked !== false,
      };
    }

    function renderCorpShapes() {
      const company = onlyChars(els.company.value) || "주식회사위캔";
      const center = onlyChars(els.center.value) || "代表理事";
      const opts = corpOpts();
      els.corpShapes.innerHTML = "";
      [
        { key: "circle", label: "원형 법인인감 (실인)" },
        { key: "square", label: "사각 법인직인" },
      ].forEach((item) => {
        const box = document.createElement("div");
        box.className = "corp-shape" + (corpShape === item.key ? " on" : "");
        const c = document.createElement("canvas");
        c.width = 220;
        c.height = 220;
        if (item.key === "circle") drawCorpCircle(c, company, center, 220, opts);
        else drawCorpSquare(c, company, 220);
        box.appendChild(c);
        const span = document.createElement("span");
        span.textContent = item.label;
        box.appendChild(span);
        box.addEventListener("click", () => {
          corpShape = item.key;
          renderCorpShapes();
          make(false);
        });
        els.corpShapes.appendChild(box);
      });
    }

    function make(announce) {
      if (mode === "personal") {
        const text = stampTextFor(selected.script);
        if (!text) {
          setStatus("err", "이름을 입력하세요.");
          return false;
        }
        drawPersonalStamp(els.preview, text, selected.font, selected.shape, 640);
        lastText = text;
        const f = fontMeta(selected.font).label;
        const v = VARIANTS.find((x) => x.shape === selected.shape && x.script === selected.script);
        els.selLabel.textContent = `${f} · ${v ? v.title : ""} · ${text}`;
      } else {
        const company = onlyChars(els.company.value);
        const center = onlyChars(els.center.value) || "대표이사";
        if (!company) {
          setStatus("err", "회사명을 입력하세요.");
          return false;
        }
        if (corpShape === "circle") {
          drawCorpCircle(els.preview, company, center, 640, corpOpts());
          lastText = `${company}_${center}`;
          els.corpSelLabel.textContent = `원형 법인인감 · ${company} / ${center}`;
        } else {
          drawCorpSquare(els.preview, company, 640);
          lastText = company;
          els.corpSelLabel.textContent = `사각 법인직인 · ${company}`;
        }
      }
      lastDataUrl = els.preview.toDataURL("image/png");
      if (announce !== false) setStatus("", "");
      return true;
    }

    function setStatus(kind, msg) {
      els.status.className = "status" + (kind ? " " + kind : "");
      els.status.textContent = msg || "";
    }

    function setMode(next) {
      mode = next;
      els.modePersonal.classList.toggle("active", mode === "personal");
      els.modeCorp.classList.toggle("active", mode === "corp");
      els.personalCard.classList.toggle("hidden", mode !== "personal");
      els.corpCard.classList.toggle("hidden", mode !== "corp");
      refresh();
    }

    function refresh() {
      if (mode === "personal") renderPersonalPicker();
      else renderCorpShapes();
      make(false);
    }

    els.modePersonal.addEventListener("click", () => setMode("personal"));
    els.modeCorp.addEventListener("click", () => setMode("corp"));
    els.name.addEventListener("input", refresh);
    els.company.addEventListener("input", refresh);
    els.center.addEventListener("input", refresh);
    document.getElementById("inkTexture")?.addEventListener("change", refresh);
    document.getElementById("centerHanja")?.addEventListener("change", refresh);
    document.getElementById("centerChips").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-center]");
      if (!btn) return;
      els.center.value = btn.dataset.center;
      refresh();
    });

    els.makeBtn.addEventListener("click", () => {
      if (make(true)) setStatus("ok", "도장이 완성되었습니다.");
    });
    els.downloadBtn.addEventListener("click", () => {
      if (!make(false)) return;
      const a = document.createElement("a");
      a.href = lastDataUrl;
      a.download = `도장_${lastText || "stamp"}.png`;
      a.click();
    });
    els.applyBtn.addEventListener("click", async () => {
      if (!make(false)) return;
      if (!els.pin.value) {
        setStatus("err", "접속 비밀번호를 입력하세요.");
        return;
      }
      try {
        const res = await fetch("/api/seal", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: els.pin.value, image: lastDataUrl }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "적용 실패");
        setStatus("ok", "서류 도장에 적용했습니다.");
      } catch (err) {
        setStatus("err", err.message);
      }
    });
    els.resetBtn.addEventListener("click", async () => {
      if (!els.pin.value) {
        setStatus("err", "접속 비밀번호를 입력하세요.");
        return;
      }
      try {
        const res = await fetch("/api/seal", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: els.pin.value }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "복원 실패");
        setStatus("ok", "기본 도장으로 되돌렸습니다.");
      } catch (err) {
        setStatus("err", err.message);
      }
    });

    // URL ?mode=corp 지원
    if (new URLSearchParams(location.search).get("mode") === "corp") setMode("corp");
    else refresh();
  </script>
</body>
</html>
