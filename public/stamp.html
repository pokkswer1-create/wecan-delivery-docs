<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>온라인 도장 · 위캔</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --line: #2c3848;
      --text: #eef3f8;
      --muted: #93a4b8;
      --accent: #1f8a70;
      --accent-2: #f0b429;
      --stamp: #c62828;
      --radius: 14px;
      --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1000px 420px at 8% -8%, #3a1d1d 0%, transparent 55%),
        radial-gradient(800px 360px at 100% 0%, #1d3a33 0%, transparent 50%),
        var(--bg);
      padding: 20px 16px 48px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .nav a {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 600;
    }
    header .brand {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 800;
    }
    header p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, white 8%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #12181f;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .styles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .style-btn {
      border: 1px solid var(--line);
      background: #12181f;
      border-radius: 12px;
      padding: 10px 6px;
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }
    .style-btn.active {
      border-color: var(--stamp);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--stamp) 40%, transparent);
    }
    .style-btn canvas {
      width: 72px;
      height: 72px;
      display: block;
      margin: 0 auto 6px;
    }
    .style-btn span {
      display: block;
      font-size: 12px;
      font-weight: 600;
    }
    .opts {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .opts label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--text);
      cursor: pointer;
    }
    .opts input { width: auto; margin: 0; }
    .preview-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      background:
        linear-gradient(45deg, #e8e8e8 25%, transparent 25%),
        linear-gradient(-45deg, #e8e8e8 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e8e8e8 75%),
        linear-gradient(-45deg, transparent 75%, #e8e8e8 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-color: #f5f5f5;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    #preview {
      width: 180px;
      height: 180px;
      max-width: 100%;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button.primary {
      background: linear-gradient(180deg, #2aa889, var(--accent));
      color: #fff;
    }
    button.ghost {
      background: #12181f;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.danger {
      background: color-mix(in srgb, #e35d6a 25%, #12181f);
      color: #ffc9cf;
      border: 1px solid color-mix(in srgb, #e35d6a 50%, var(--line));
    }
    .hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .status {
      min-height: 20px;
      font-size: 13px;
      margin-top: 4px;
    }
    .status.ok { color: #3ecf8e; }
    .status.err { color: #e35d6a; }
    .steps {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <a href="/">← 납품서류</a>
      <span style="color:var(--muted)">온라인 도장</span>
    </div>
    <header>
      <div class="brand">WECAN</div>
      <h1>온라인 도장</h1>
      <p>이름을 넣고 스타일을 고른 뒤 도장을 만드세요. PNG로 저장하거나 납품서류에 바로 적용할 수 있습니다.</p>
    </header>

    <div class="card">
      <h2>도장 만들기</h2>
      <label for="name">이름 (예: 김강선)</label>
      <input id="name" type="text" maxlength="6" placeholder="도장에 새길 이름" value="김강선" />

      <label>도장 모양 · 서체</label>
      <div class="styles" id="styles"></div>

      <div class="opts">
        <label><input type="checkbox" id="addIn" checked /> 끝에 「인」 붙이기</label>
        <label><input type="radio" name="shape" value="circle" checked /> 원형</label>
        <label><input type="radio" name="shape" value="square" /> 사각</label>
      </div>

      <div class="preview-wrap">
        <canvas id="preview" width="512" height="512"></canvas>
      </div>

      <button class="primary" type="button" id="makeBtn">도장 만들기</button>
      <button class="ghost" type="button" id="downloadBtn">이미지로 저장하기</button>
    </div>

    <div class="card">
      <h2>납품서류에 적용</h2>
      <p class="hint">만든 도장을 견적서·납품서·거래명세서 서명란에 사용합니다. (접속 비밀번호 필요)</p>
      <label for="pin">접속 비밀번호</label>
      <input id="pin" type="password" autocomplete="current-password" />
      <button class="primary" type="button" id="applyBtn">서류 도장으로 적용</button>
      <button class="danger" type="button" id="resetBtn">기본 도장으로 되돌리기</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <h2>이용방법</h2>
      <ol class="steps">
        <li>이름을 입력합니다.</li>
        <li>서체·원형/사각을 고릅니다.</li>
        <li>도장 만들기를 누릅니다.</li>
        <li>이미지 저장 또는 서류에 적용합니다.</li>
      </ol>
    </div>
  </div>

  <script>
    const FONTS = {
      gothic: { label: "고딕체", family: '"Malgun Gothic", "Apple SD Gothic Neo", sans-serif', weight: "800" },
      batang: { label: "바탕체", family: "Batang, serif", weight: "700" },
      gungseo: { label: "궁서체", family: "Gungsuh, \"Apple Myungjo\", serif", weight: "700" },
    };

    const els = {
      name: document.getElementById("name"),
      styles: document.getElementById("styles"),
      preview: document.getElementById("preview"),
      addIn: document.getElementById("addIn"),
      makeBtn: document.getElementById("makeBtn"),
      downloadBtn: document.getElementById("downloadBtn"),
      applyBtn: document.getElementById("applyBtn"),
      resetBtn: document.getElementById("resetBtn"),
      pin: document.getElementById("pin"),
      status: document.getElementById("status"),
    };

    let selectedFont = "gothic";
    let lastDataUrl = "";

    function stampText() {
      const raw = (els.name.value || "").trim().replace(/\s+/g, "");
      if (!raw) return "";
      if (els.addIn.checked && !raw.endsWith("인")) return raw + "인";
      return raw;
    }

    function shape() {
      return document.querySelector('input[name="shape"]:checked')?.value || "circle";
    }

    function drawStamp(canvas, text, fontKey, shapeKind, size) {
      const ctx = canvas.getContext("2d");
      const s = size || canvas.width;
      canvas.width = s;
      canvas.height = s;
      ctx.clearRect(0, 0, s, s);

      const ink = "#c62828";
      const cx = s / 2;
      const cy = s / 2;
      const r = s * 0.42;

      ctx.strokeStyle = ink;
      ctx.fillStyle = ink;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (shapeKind === "square") {
        const pad = s * 0.1;
        const w = s - pad * 2;
        ctx.lineWidth = s * 0.028;
        ctx.strokeRect(pad, pad, w, w);
        ctx.lineWidth = s * 0.014;
        const inset = s * 0.045;
        ctx.strokeRect(pad + inset, pad + inset, w - inset * 2, w - inset * 2);
      } else {
        ctx.lineWidth = s * 0.028;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = s * 0.014;
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.88, 0, Math.PI * 2);
        ctx.stroke();
      }

      const chars = [...text];
      if (!chars.length) return;

      const font = FONTS[fontKey] || FONTS.gothic;
      const n = chars.length;
      let fontSize;
      if (n <= 2) fontSize = s * 0.28;
      else if (n === 3) fontSize = s * 0.22;
      else if (n === 4) fontSize = s * 0.18;
      else fontSize = s * 0.14;

      ctx.font = `${font.weight} ${fontSize}px ${font.family}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if (n <= 4) {
        const lineH = fontSize * 0.95;
        const startY = cy - ((n - 1) * lineH) / 2;
        chars.forEach((ch, i) => {
          ctx.fillText(ch, cx, startY + i * lineH);
        });
      } else {
        const cols = 2;
        const rows = Math.ceil(n / cols);
        const lineH = fontSize * 0.95;
        const colGap = fontSize * 0.95;
        const startY = cy - ((rows - 1) * lineH) / 2;
        chars.forEach((ch, i) => {
          const col = Math.floor(i / rows);
          const row = i % rows;
          const x = cx - colGap / 2 + col * colGap;
          ctx.fillText(ch, x, startY + row * lineH);
        });
      }
    }

    function renderStyles() {
      els.styles.innerHTML = "";
      Object.entries(FONTS).forEach(([key, meta]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "style-btn" + (key === selectedFont ? " active" : "");
        btn.dataset.font = key;
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        drawStamp(c, "인", key, "circle", 128);
        btn.appendChild(c);
        const span = document.createElement("span");
        span.textContent = meta.label;
        btn.appendChild(span);
        btn.addEventListener("click", () => {
          selectedFont = key;
          renderStyles();
          make();
        });
        els.styles.appendChild(btn);
      });
    }

    function make() {
      const text = stampText();
      if (!text) {
        setStatus("err", "이름을 입력하세요.");
        return;
      }
      drawStamp(els.preview, text, selectedFont, shape(), 512);
      lastDataUrl = els.preview.toDataURL("image/png");
      setStatus("", "");
    }

    function setStatus(kind, msg) {
      els.status.className = "status" + (kind ? " " + kind : "");
      els.status.textContent = msg || "";
    }

    els.makeBtn.addEventListener("click", make);
    els.name.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        make();
      }
    });
    els.addIn.addEventListener("change", make);
    document.querySelectorAll('input[name="shape"]').forEach((el) => {
      el.addEventListener("change", make);
    });

    els.downloadBtn.addEventListener("click", () => {
      if (!lastDataUrl) make();
      if (!lastDataUrl) return;
      const a = document.createElement("a");
      a.href = lastDataUrl;
      a.download = `도장_${stampText() || "stamp"}.png`;
      a.click();
    });

    els.applyBtn.addEventListener("click", async () => {
      if (!lastDataUrl) make();
      if (!lastDataUrl) return;
      if (!els.pin.value) {
        setStatus("err", "접속 비밀번호를 입력하세요.");
        return;
      }
      try {
        const res = await fetch("/api/seal", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: els.pin.value, image: lastDataUrl }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "적용 실패");
        setStatus("ok", "서류 도장에 적용했습니다. 이제 납품서류를 만들어 보세요.");
      } catch (err) {
        setStatus("err", err.message);
      }
    });

    els.resetBtn.addEventListener("click", async () => {
      if (!els.pin.value) {
        setStatus("err", "접속 비밀번호를 입력하세요.");
        return;
      }
      try {
        const res = await fetch("/api/seal", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: els.pin.value }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "복원 실패");
        setStatus("ok", "기본 도장으로 되돌렸습니다.");
      } catch (err) {
        setStatus("err", err.message);
      }
    });

    renderStyles();
    make();
  </script>
</body>
</html>
