services:
  - type: web
    name: wecan-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/meta
    envVars:
      - key: FORM_PIN
        sync: false
      - key: SMTP_HOST
        value: smtp.naver.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
