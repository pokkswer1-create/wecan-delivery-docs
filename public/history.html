<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>발송 이력 · 위캔</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/app.css?v=20260828" />
</head>
<body>
  <div class="topbar"><a class="logo" href="/">위캔</a></div>
  <div class="wrap">
    <nav class="app-nav" aria-label="주요 메뉴">
      <a href="/">물품</a>
      <a class="active" href="/history.html" aria-current="page">이력</a>
      <a href="/settings.html">설정</a>
    </nav>
    <header>
      <h1>발송 이력</h1>
      <p>메일 발송과 <strong>수신확인(PDF 다운로드)</strong>을 확인합니다. 상대가 수신확인 링크로 PDF를 받으면 확정됩니다.</p>
    </header>

    <div class="card" id="loginCard">
      <h2>구글 로그인</h2>
      <p class="hint">로그인하면 이 계정이 보낸 이력을 봅니다.</p>
      <a class="google-btn" href="/auth/google">Google로 로그인</a>
      <div class="status" id="authError"></div>
    </div>
    <div class="user-bar hidden" id="userBar">
      <span id="userEmail"></span>
      <a href="/auth/logout">로그아웃</a>
    </div>

    <div class="card hidden" id="listCard">
      <h2>목록</h2>
      <p class="hint">수신확인 = 상대가 메일 속 「PDF 받고 수신확인」 링크로 다운로드한 경우만 표시됩니다. 첨부파일만 연 경우는 추적되지 않습니다.</p>
      <button class="ghost" type="button" id="refreshBtn">새로고침</button>
      <div class="status" id="status"></div>
      <div id="list" class="empty">불러오는 중…</div>
    </div>
  </div>

  <script>
    const LOCAL_KEY = "wecan_mail_log_v1";
    const els = {
      loginCard: document.getElementById("loginCard"),
      userBar: document.getElementById("userBar"),
      userEmail: document.getElementById("userEmail"),
      authError: document.getElementById("authError"),
      listCard: document.getElementById("listCard"),
      refreshBtn: document.getElementById("refreshBtn"),
      status: document.getElementById("status"),
      list: document.getElementById("list"),
    };

    function setStatus(kind, msg) {
      els.status.className = "status show" + (kind ? " " + kind : "");
      els.status.textContent = msg || "";
    }

    function fmtTime(iso) {
      if (!iso) return "-";
      try {
        return new Date(iso).toLocaleString("ko-KR");
      } catch (_) {
        return iso;
      }
    }

    function money(n) {
      return Math.round(Number(n) || 0).toLocaleString("ko-KR");
    }

    function readLocal() {
      try {
        const list = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
        return Array.isArray(list) ? list : [];
      } catch (_) {
        return [];
      }
    }

    function writeLocal(list) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list.slice(0, 200)));
    }

    function mergeItems(serverItems, localItems) {
      const map = new Map();
      [...localItems, ...serverItems].forEach((e) => {
        if (!e || !e.id) return;
        const prev = map.get(e.id);
        if (!prev) {
          map.set(e.id, e);
          return;
        }
        // 수신확인·최신 정보 우선
        map.set(e.id, {
          ...prev,
          ...e,
          downloadedAt: e.downloadedAt || prev.downloadedAt || null,
          downloadCount: Math.max(Number(e.downloadCount || 0), Number(prev.downloadCount || 0)),
          receiptConfirmed: Boolean(
            e.receiptConfirmed || prev.receiptConfirmed || e.downloadedAt || prev.downloadedAt
          ),
          receiptUrl: e.receiptUrl || prev.receiptUrl || "",
        });
      });
      return [...map.values()].sort((a, b) => String(b.sentAt || "").localeCompare(String(a.sentAt || "")));
    }

    function renderItems(items) {
      if (!items.length) {
        els.list.className = "empty";
        els.list.innerHTML =
          "아직 발송 이력이 없습니다.<br><br>납품서류에서 이메일 발송을 한 번 하면 여기에 나타납니다.<br>(이 기능 추가 전에 보낸 메일은 기록되지 않습니다)";
        return;
      }
      els.list.className = "";
      els.list.innerHTML = items
        .map((e) => {
          const confirmed = e.receiptConfirmed || e.downloadedAt;
          return `<div class="item">
            <div class="top">
              <strong>${escapeHtml(e.subject || e.titles || "납품서류")}</strong>
              <span class="badge ${confirmed ? "received" : "sent"}">${confirmed ? "수신확인" : "발송됨"}</span>
            </div>
            <div class="meta">
              받는 사람: ${escapeHtml(e.to || "-")}<br>
              발송: ${fmtTime(e.sentAt)}<br>
              수신확인(다운로드): ${confirmed ? fmtTime(e.downloadedAt) : "아직 없음"}
              ${e.downloadCount ? ` · ${e.downloadCount}회` : ""}<br>
              합계: ${money(e.totalSum)}원
              ${e.receiptUrl ? `<br><a href="${escapeAttr(e.receiptUrl)}" target="_blank" rel="noopener">수신확인 링크</a>` : ""}
            </div>
          </div>`;
        })
        .join("");
    }

    async function load() {
      setStatus("", "불러오는 중…");
      const localItems = readLocal();
      let serverItems = [];
      let serverErr = "";
      try {
        const res = await fetch("/api/mail-log", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          const rawHint =
            typeof data === "object" && data.error
              ? data.error
              : res.status === 502 || res.status === 504
                ? "서버 응답 시간 초과. 잠시 후 다시 시도하세요."
                : `서버 오류 (${res.status})`;
          throw new Error(rawHint);
        }
        serverItems = data.items || [];
        // 서버 수신된 수신확인을 로컬에도 반영
        if (serverItems.length) {
          writeLocal(mergeItems(serverItems, localItems));
        }
      } catch (err) {
        serverErr = err.message || String(err);
      }

      const items = mergeItems(serverItems, localItems);
      renderItems(items);
      if (serverErr && !items.length) {
        setStatus("err", serverErr);
        return;
      }
      const okCount = items.filter((x) => x.receiptConfirmed || x.downloadedAt).length;
      setStatus(
        "ok",
        serverErr
          ? `이 폰 저장 ${items.length}건 표시 (서버: ${serverErr})`
          : `${items.length}건 · 수신확인 ${okCount}건`
      );
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeAttr(s) {
      return escapeHtml(s);
    }

    async function init() {
      const q = new URLSearchParams(location.search);
      const authErr = q.get("auth_error") || "";
      if (authErr) {
        els.authError.className = "status show err";
        els.authError.textContent = authErr;
      }
      const me = await fetch("/api/me").then((r) => r.json());
      if (!me.loggedIn) {
        if (!me.googleConfigured && !authErr) {
          els.authError.className = "status show err";
          els.authError.textContent =
            "구글 로그인이 아직 설정되지 않았습니다. GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET을 넣으세요.";
        }
        return;
      }
      els.loginCard.classList.add("hidden");
      els.userBar.classList.remove("hidden");
      els.listCard.classList.remove("hidden");
      els.userEmail.textContent = me.email || "";
      await load();
    }

    els.refreshBtn.addEventListener("click", load);
    init().catch((err) => {
      els.authError.className = "status show err";
      els.authError.textContent = err.message || String(err);
    });
  </script>
</body>
</html>
