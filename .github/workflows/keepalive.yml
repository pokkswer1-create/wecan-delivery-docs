# Keep Render free tier warm: ping every 10 minutes
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render
        run: |
          set -e
          URL="https://wecan-docs.onrender.com/api/meta"
          echo "Ping $URL"
          code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 120 "$URL" || echo "000")
          echo "HTTP $code"
          head -c 200 /tmp/body || true
          echo
          # Wake purpose only — do not fail the job on 5xx/timeout
          exit 0
